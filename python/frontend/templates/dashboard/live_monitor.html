{% extends "base_dashboard.html" %}{% block title %}Live Call Monitor — VoiceFlow AI{% endblock %}
{% block content %}
<div x-data="liveMonitorApp()" x-init="init()" class="space-y-6 fade-in-up">

  <!-- Header -->
  <div class="flex items-center justify-between">
    <div class="flex items-center gap-3">
      <div class="relative">
        <div class="w-3 h-3 rounded-full bg-green-500 animate-pulse"></div>
      </div>
      <div>
        <h1 class="text-3xl font-bold vf-heading bg-gradient-to-r from-gray-900 via-gray-700 to-gray-900 dark:from-white dark:via-gray-200 dark:to-white bg-clip-text text-transparent">Live Call Monitor</h1>
        <p class="text-slate-500 dark:text-gray-400 text-sm mt-0.5">
          <span x-text="calls.length"></span> active call<span x-show="calls.length !== 1">s</span> — auto-refreshes every 3s
        </p>
      </div>
    </div>
    <div class="flex items-center gap-3">
      <button @click="refresh()" :disabled="loading" class="flex items-center gap-2 text-sm px-3 py-2 border border-slate-200 dark:border-gray-700 rounded-lg hover:bg-slate-50 dark:hover:bg-gray-800 transition disabled:opacity-50">
        <svg :class="loading ? 'animate-spin' : ''" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
        Refresh
      </button>
    </div>
  </div>

  <!-- Empty state -->
  <template x-if="!loading && calls.length === 0">
    <div class="vf-card p-12 text-center">
      <div class="w-16 h-16 rounded-full bg-slate-100 dark:bg-gray-800 flex items-center justify-center mx-auto mb-4">
        <svg class="w-8 h-8 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"/></svg>
      </div>
      <p class="text-slate-500 dark:text-gray-400 text-sm">No active calls right now.</p>
      <p class="text-slate-400 dark:text-gray-500 text-xs mt-1">When calls come in they'll appear here in real-time.</p>
    </div>
  </template>

  <!-- Active call cards -->
  <div class="grid lg:grid-cols-2 xl:grid-cols-3 gap-5">
    <template x-for="call in calls" :key="call.call_sid">
      <div class="vf-card flex flex-col overflow-hidden" :class="selectedSid === call.call_sid ? 'ring-2 ring-indigo-500' : ''">

        <!-- Call header -->
        <div class="p-4 border-b border-slate-100 dark:border-gray-700/50">
          <div class="flex items-start justify-between gap-3">
            <div class="flex items-center gap-3 min-w-0">
              <!-- State indicator -->
              <div class="flex-shrink-0 relative">
                <div class="w-10 h-10 rounded-full flex items-center justify-center text-white text-xs font-bold"
                     :class="{
                       'bg-blue-500 animate-pulse': call.state === 'listening',
                       'bg-amber-500 animate-pulse': call.state === 'thinking',
                       'bg-green-500': call.state === 'speaking',
                       'bg-slate-400': !['listening','thinking','speaking'].includes(call.state),
                     }">
                  <svg x-show="call.state === 'listening'" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4M12 4a3 3 0 00-3 3v4a3 3 0 006 0V7a3 3 0 00-3-3z"/></svg>
                  <svg x-show="call.state === 'thinking'" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z"/></svg>
                  <svg x-show="call.state === 'speaking'" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.536 8.464a5 5 0 010 7.072M12 6v12m3-3H9"/></svg>
                  <svg x-show="!['listening','thinking','speaking'].includes(call.state)" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5.636 18.364a9 9 0 010-12.728m12.728 0a9 9 0 010 12.728"/></svg>
                </div>
                <!-- State label tooltip -->
                <div class="absolute -bottom-5 left-1/2 -translate-x-1/2 text-[9px] font-semibold uppercase tracking-wide whitespace-nowrap"
                     :class="{
                       'text-blue-500': call.state === 'listening',
                       'text-amber-500': call.state === 'thinking',
                       'text-green-500': call.state === 'speaking',
                       'text-slate-400': !['listening','thinking','speaking'].includes(call.state),
                     }" x-text="call.state || 'idle'"></div>
              </div>
              <div class="min-w-0 ml-2">
                <div class="font-semibold text-sm truncate" x-text="call.caller_number || 'Unknown caller'"></div>
                <div class="text-xs text-slate-500 dark:text-gray-400 truncate" x-text="call.agent_name"></div>
              </div>
            </div>
            <div class="flex-shrink-0 text-right">
              <!-- Duration -->
              <div class="text-sm font-mono font-medium text-slate-600 dark:text-gray-300" x-text="formatDuration(call.duration_seconds)"></div>
              <!-- Sentiment -->
              <span class="text-xs px-1.5 py-0.5 rounded-full font-medium"
                    :class="{
                      'bg-green-100 dark:bg-green-900/30 text-green-700 dark:text-green-400': call.sentiment === 'positive',
                      'bg-red-100 dark:bg-red-900/30 text-red-700 dark:text-red-400': call.sentiment === 'negative',
                      'bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-gray-300': !['positive','negative'].includes(call.sentiment || ''),
                    }" x-text="call.sentiment || 'neutral'"></span>
            </div>
          </div>
        </div>

        <!-- Live transcript (last 3 turns) -->
        <div class="p-4 flex-1 space-y-2 min-h-[100px] max-h-48 overflow-y-auto">
          <template x-if="call.transcript && call.transcript.length === 0">
            <p class="text-xs text-slate-400 dark:text-gray-500 italic">Waiting for transcript…</p>
          </template>
          <template x-for="(turn, idx) in (call.transcript || []).slice(-4)" :key="idx">
            <div class="flex gap-2" :class="turn.role === 'user' ? 'justify-start' : 'justify-end'">
              <div class="max-w-[85%] text-xs px-3 py-1.5 rounded-2xl"
                   :class="turn.role === 'user'
                     ? 'bg-slate-100 dark:bg-gray-700 text-slate-700 dark:text-gray-200 rounded-tl-none'
                     : 'bg-indigo-100 dark:bg-indigo-900/40 text-indigo-800 dark:text-indigo-200 rounded-tr-none'"
                   x-text="turn.content"></div>
            </div>
          </template>
        </div>

        <!-- Extracted vars (if any) -->
        <template x-if="call.extracted_vars && Object.keys(call.extracted_vars).length > 0">
          <div class="px-4 pb-3 flex flex-wrap gap-1.5">
            <template x-for="[k, v] in Object.entries(call.extracted_vars)" :key="k">
              <span class="text-[10px] px-2 py-0.5 rounded-full bg-teal-100 dark:bg-teal-900/30 text-teal-700 dark:text-teal-300 font-medium">
                <span x-text="k"></span>: <span x-text="v"></span>
              </span>
            </template>
          </div>
        </template>

        <!-- Action buttons -->
        <div class="p-3 border-t border-slate-100 dark:border-gray-700/50 flex gap-2">
          <button @click="openDetail(call)" class="flex-1 text-xs font-medium px-3 py-2 rounded-lg bg-slate-100 dark:bg-gray-800 hover:bg-slate-200 dark:hover:bg-gray-700 transition text-slate-600 dark:text-gray-300 flex items-center justify-center gap-1.5">
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>
            Monitor
          </button>
          <button @click="openTakeover(call)" class="flex-1 text-xs font-medium px-3 py-2 rounded-lg bg-amber-100 dark:bg-amber-900/30 hover:bg-amber-200 dark:hover:bg-amber-900/60 transition text-amber-700 dark:text-amber-400 flex items-center justify-center gap-1.5">
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
            Take Over
          </button>
          <button @click="endCall(call.call_sid)" class="px-3 py-2 rounded-lg bg-red-100 dark:bg-red-900/30 hover:bg-red-200 dark:hover:bg-red-900/60 transition text-red-600 dark:text-red-400">
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 8l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2M5 3a2 2 0 00-2 2v1c0 8.284 6.716 15 15 15h1a2 2 0 002-2v-3.28a1 1 0 00-.684-.948l-4.493-1.498a1 1 0 00-1.21.502l-1.13 2.257a11.042 11.042 0 01-5.516-5.517l2.257-1.128a1 1 0 00.502-1.21L9.228 3.683A1 1 0 008.279 3H5z"/></svg>
          </button>
        </div>

      </div>
    </template>
  </div><!-- /grid -->

  <!-- Detail / full transcript panel -->
  <div x-show="detailCall" x-cloak class="fixed inset-0 z-50 flex items-center justify-center bg-black/50 backdrop-blur-sm p-4" @click.self="detailCall=null">
    <div class="bg-white dark:bg-gray-900 rounded-2xl shadow-2xl w-full max-w-2xl max-h-[90vh] flex flex-col">
      <div class="flex items-center justify-between p-5 border-b border-slate-200 dark:border-gray-700">
        <div>
          <div class="font-semibold" x-text="detailCall?.caller_number"></div>
          <div class="text-xs text-slate-500 dark:text-gray-400" x-text="'Agent: ' + (detailCall?.agent_name || '')"></div>
        </div>
        <button @click="detailCall=null" class="text-slate-400 hover:text-slate-600 dark:hover:text-gray-300">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
        </button>
      </div>
      <div class="flex-1 overflow-y-auto p-5 space-y-3">
        <template x-for="(turn, idx) in (detailCall?.transcript || [])" :key="idx">
          <div class="flex gap-3" :class="turn.role === 'user' ? 'justify-start' : 'justify-end'">
            <div class="max-w-[80%] text-sm px-4 py-2 rounded-2xl"
                 :class="turn.role === 'user'
                   ? 'bg-slate-100 dark:bg-gray-700 text-slate-700 dark:text-gray-200 rounded-tl-none'
                   : 'bg-indigo-100 dark:bg-indigo-900/40 text-indigo-800 dark:text-indigo-200 rounded-tr-none'"
                 x-text="turn.content"></div>
          </div>
        </template>
      </div>
      <!-- Supervisor note -->
      <div class="p-4 border-t border-slate-200 dark:border-gray-700 flex gap-3">
        <input x-model="noteText" type="text" placeholder="Add supervisor note…" class="flex-1 text-sm border dark:border-gray-700 rounded-lg px-3 py-2 dark:bg-gray-800 dark:text-white">
        <button @click="addNote(detailCall?.call_sid)" class="vf-btn-primary text-sm px-4 py-2">Note</button>
      </div>
    </div>
  </div>

  <!-- Take Over modal -->
  <div x-show="takeoverCall" x-cloak class="fixed inset-0 z-50 flex items-center justify-center bg-black/50 backdrop-blur-sm p-4" @click.self="takeoverCall=null">
    <div class="bg-white dark:bg-gray-900 rounded-2xl shadow-2xl w-full max-w-md p-6">
      <h3 class="text-lg font-semibold mb-1">Take Over Call</h3>
      <p class="text-sm text-slate-500 dark:text-gray-400 mb-4">Transfer <strong x-text="takeoverCall?.caller_number"></strong> to a human agent.</p>
      <div class="space-y-3">
        <div>
          <label class="block text-xs font-medium text-slate-500 dark:text-gray-400 mb-1">Transfer to (E.164)</label>
          <input x-model="transferTo" type="tel" placeholder="+919876543210" class="w-full border dark:border-gray-700 rounded-lg px-3 py-2 text-sm dark:bg-gray-800 dark:text-white">
        </div>
        <div>
          <label class="block text-xs font-medium text-slate-500 dark:text-gray-400 mb-1">Whisper message</label>
          <input x-model="whisperMsg" type="text" placeholder="You have a call transfer from VoiceFlow AI." class="w-full border dark:border-gray-700 rounded-lg px-3 py-2 text-sm dark:bg-gray-800 dark:text-white">
        </div>
      </div>
      <div class="flex gap-3 mt-5">
        <button @click="takeoverCall=null" class="flex-1 px-4 py-2 text-sm border border-slate-300 dark:border-gray-600 rounded-lg hover:bg-slate-50 dark:hover:bg-gray-800 transition">Cancel</button>
        <button @click="executeTakeover()" :disabled="!transferTo || takeoverLoading" class="flex-1 px-4 py-2 text-sm vf-btn-primary disabled:opacity-60">
          <span x-text="takeoverLoading ? 'Transferring…' : 'Transfer Now'"></span>
        </button>
      </div>
    </div>
  </div>

</div><!-- /main -->

<style>
[x-cloak] { display: none !important; }
</style>

<script>
function liveMonitorApp() {
  return {
    calls: [],
    loading: false,
    selectedSid: null,
    detailCall: null,
    noteText: '',
    takeoverCall: null,
    transferTo: '',
    whisperMsg: 'You have a call transfer from VoiceFlow AI.',
    takeoverLoading: false,
    _interval: null,

    async init() {
      await this.refresh();
      this._interval = setInterval(() => this.refresh(), 3000);
      this.$watch('detailCall', (val) => {
        if (!val) this.selectedSid = null;
      });
    },

    async refresh() {
      this.loading = true;
      try {
        const r = await fetch('/api/live-monitor/calls', { credentials: 'include' });
        if (!r.ok) return;
        const d = await r.json();
        // Merge incoming calls: preserve selectedSid expansion
        this.calls = d.calls || [];
        // If we have an open detail, refresh it
        if (this.detailCall) {
          const updated = this.calls.find(c => c.call_sid === this.detailCall.call_sid);
          if (updated) this.detailCall = { ...this.detailCall, ...updated };
        }
      } catch { } finally {
        this.loading = false;
      }
    },

    openDetail(call) {
      this.selectedSid = call.call_sid;
      this.detailCall = { ...call };
    },

    openTakeover(call) {
      this.takeoverCall = call;
    },

    async executeTakeover() {
      if (!this.takeoverCall || !this.transferTo) return;
      this.takeoverLoading = true;
      try {
        const r = await fetch(`/api/live-monitor/calls/${this.takeoverCall.call_sid}/takeover`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'include',
          body: JSON.stringify({ transfer_to: this.transferTo, whisper_message: this.whisperMsg }),
        });
        const d = await r.json();
        if (!r.ok) { alert(d.detail || 'Transfer failed'); return; }
        alert(`✓ ${d.message}`);
        this.takeoverCall = null;
        this.transferTo = '';
      } catch (e) {
        alert('Network error');
      } finally {
        this.takeoverLoading = false;
      }
    },

    async endCall(callSid) {
      if (!confirm('Force-end this call?')) return;
      try {
        const r = await fetch(`/api/live-monitor/calls/${callSid}/end`, {
          method: 'POST', credentials: 'include',
        });
        const d = await r.json();
        if (!r.ok) { alert(d.detail || 'Failed'); return; }
        this.calls = this.calls.filter(c => c.call_sid !== callSid);
        if (this.detailCall?.call_sid === callSid) this.detailCall = null;
      } catch { alert('Error ending call'); }
    },

    async addNote(callSid) {
      if (!this.noteText.trim()) return;
      try {
        await fetch(`/api/live-monitor/calls/${callSid}/note`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'include',
          body: JSON.stringify({ note: this.noteText }),
        });
        this.noteText = '';
      } catch { }
    },

    formatDuration(secs) {
      if (!secs && secs !== 0) return '—';
      const m = Math.floor(secs / 60);
      const s = secs % 60;
      return `${m}:${String(s).padStart(2, '0')}`;
    },
  };
}
</script>
{% endblock %}
